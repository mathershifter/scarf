[project]
name = "scarf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jesse Mather", email = "jmather@arista.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.23.1",
    "click>=8.4.1",
    "filelock>=3.29.4",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "structlog>=26.1.0",
]

[project.scripts]
scarf = "scarf.cli:cli"

[project.optional-dependencies]
all = [
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]
